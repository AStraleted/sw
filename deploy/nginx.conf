# Пример настройки nginx для SQULED Studio
# Замените example.com на свой домен. Сертификат удобно получить через certbot.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/squled
#   sudo ln -s /etc/nginx/sites-available/squled /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# В .env при этом должно быть: COOKIE_SECURE=true и TRUST_PROXY=true

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Размер загружаемых файлов должен совпадать с MAX_FILE_MB в .env
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обязательно: без этого ответ модели придёт целиком, а не потоком
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Длинные ответы не должны обрываться по таймауту
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
